[tools]
k3d = "latest"
python = "3.13"
ruff = "latest"
trivy = "latest"
uv = "latest"
kubectl = "latest"
k9s = "latest"

[settings]
python.uv_venv_auto = "create|source"
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[env]
APP_REPO = 'devops-study-app'
GITOPS_REPO = 'devops-study-app-gitops'

[hooks]
enter = "bash ./scripts/setup_project"
